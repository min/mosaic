name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install linters
        # Not guaranteed on the runner image; no-op when already present.
        run: brew list swiftformat &>/dev/null || brew install swiftformat;
          brew list swiftlint &>/dev/null || brew install swiftlint
      - run: swiftformat --lint .
      - run: swiftlint --strict --quiet

  macos:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test

  ios:
    name: test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Pick a simulator
        id: sim
        # Runner images rotate their installed simulators, so resolve one at
        # runtime instead of hard-coding a device name.
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -scheme Mosaic \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"

  examples:
    name: build examples (${{ matrix.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: MosaicExamples-macOS
            destination: platform=macOS
          - name: iOS
            scheme: MosaicExamples-iOS
            destination: platform=iOS Simulator,name=__RESOLVED__
    steps:
      - uses: actions/checkout@v7
      - name: Resolve destination
        id: dest
        run: |
          DEST="${{ matrix.destination }}"
          if [[ "$DEST" == *__RESOLVED__* ]]; then
            DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
            DEST="${DEST/__RESOLVED__/$DEVICE}"
          fi
          echo "Using destination: $DEST"
          echo "value=$DEST" >> "$GITHUB_OUTPUT"
      - name: Build
        # The committed project must stay buildable; a stale pbxproj that no
        # longer matches Examples/Shared fails here rather than on a user's Mac.
        working-directory: Examples
        run: |
          xcodebuild build \
            -project MosaicExamples.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ steps.dest.outputs.value }}"
