name: MosaicExamples

options:
  bundleIdPrefix: com.example.mosaic
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Mosaic:
    path: ..

targets:
  MosaicExamples-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
    dependencies:
      - package: Mosaic
        product: Mosaic
    info:
      path: Generated/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mosaic.examples.ios
        TARGETED_DEVICE_FAMILY: "1,2"

  MosaicExamples-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
    dependencies:
      - package: Mosaic
        product: Mosaic
    info:
      path: Generated/Info-macOS.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mosaic.examples.macos

schemes:
  MosaicExamples-iOS:
    build:
      targets:
        MosaicExamples-iOS: all
    run:
      config: Debug
  MosaicExamples-macOS:
    build:
      targets:
        MosaicExamples-macOS: all
    run:
      config: Debug
